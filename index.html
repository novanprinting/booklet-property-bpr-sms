<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a2a"><title>BOOKLET PROPERTY | Katalog Properti F4</title>
<style>
:root{--ink:#102a2a;--gold:#c8a96a;--paper:#fbf8f1;--muted:#66716d;--line:#e6dfd1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#e8e4d8 0,#c9d0ca 55%,#aab6b0 100%);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px clamp(16px,4vw,54px);color:#fff;background:var(--ink)}.brand{font-weight:800;letter-spacing:.16em;font-size:15px}.brand span{color:var(--gold)}.top small{color:#d4ddd8;letter-spacing:.12em;font-size:10px}.stage{padding:22px 14px 12px;display:flex;justify-content:center;align-items:center;min-height:calc(100vh - 132px)}
/* One portrait F4 sheet: 21.5 x 33 cm ratio (0.6515). */
.book{width:min( min(78vw, 520px), calc((100vh - 220px) * .6515));aspect-ratio:21.5/33;max-height:calc(100vh - 190px);position:relative;perspective:1800px;filter:drop-shadow(0 20px 24px #21302b40)}.sheet{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.7,.15,1);z-index:2}.sheet.flipped{transform:rotateY(-180deg)}.face{position:absolute;inset:0;background:var(--paper);backface-visibility:hidden;overflow:hidden;border:1px solid #e7e0d3}.front{border-radius:3px 7px 7px 3px}.back{transform:rotateY(180deg);border-radius:7px 3px 3px 7px}.page{position:absolute;inset:0;background:var(--paper);overflow:hidden;border:1px solid #e7e0d3;border-radius:3px 7px 7px 3px}.content{height:100%;padding:clamp(20px,4.2%,38px);display:flex;flex-direction:column;position:relative}.folio{margin-top:auto;padding-top:12px;font-size:clamp(8px,1.2vw,10px);letter-spacing:.16em;color:#8b9189;display:flex;justify-content:space-between}.eyebrow{font-size:clamp(8px,1.3vw,10px);font-weight:800;letter-spacing:.19em;text-transform:uppercase;color:#927746}.h1{font-family:Georgia,serif;font-size:clamp(34px,5.4vw,58px);font-weight:500;line-height:1.02;letter-spacing:-.035em;margin:18px 0}.h2{font-family:Georgia,serif;font-weight:500;font-size:clamp(25px,4vw,40px);line-height:1.08;margin:12px 0}.body{font-size:clamp(11px,1.55vw,15px);line-height:1.7;color:#66716d}.cover{background:linear-gradient(145deg,#102a2a 0%,#1b403d 62%,#426056 100%);color:#fff}.cover:after{content:"";position:absolute;inset:12px;border:1px solid #c8a96a88;pointer-events:none}.cover .eyebrow{color:var(--gold)}.cover .body{color:#d8e0d8}.cover-art{margin-top:auto;height:43%;min-height:120px;border-radius:3px;background:linear-gradient(180deg,#c3c4b5 0%,#71877b 42%,#344e46 43%,#243a34 100%);position:relative;overflow:hidden}.cover-art:before{content:"";position:absolute;width:75%;height:77%;left:12.5%;bottom:0;background:linear-gradient(90deg,#e6e1d2,#fff9e9 50%,#d5cfbd);clip-path:polygon(10% 30%,50% 0,90% 30%,90% 100%,10% 100%)}.cover-art:after{content:"";position:absolute;width:18%;height:35%;left:41%;bottom:0;background:#5e796b}.property-img{height:40%;min-height:125px;border-radius:4px;background:linear-gradient(135deg,#d8d4c8,#8b9c8d 55%,#3c5a4e);position:relative;overflow:hidden;margin:12px 0 15px}.property-img:before{content:"";position:absolute;left:13%;right:13%;bottom:0;height:82%;background:linear-gradient(90deg,#f5f0e4,#fffaf0 48%,#d9d2c2);clip-path:polygon(0 25%,50% 0,100% 25%,100% 100%,0 100%)}.property-img:after{content:"";position:absolute;left:43%;bottom:0;width:14%;height:38%;background:#6f897b}.price{font-weight:800;font-size:clamp(16px,2.4vw,24px);color:#8a6b31;margin:10px 0}.tag{display:inline-block;background:#eae4d6;color:#6f5b35;border-radius:2px;padding:7px 9px;font-size:clamp(8px,1.2vw,10px);letter-spacing:.1em;text-transform:uppercase;width:max-content}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.fact{background:#f0ede5;padding:10px 8px}.fact b{display:block;font-size:clamp(12px,1.8vw,17px)}.fact span{font-size:clamp(8px,1.2vw,10px);color:var(--muted)}.cta{margin-top:auto;background:var(--ink);color:white;padding:12px;text-align:center;text-decoration:none;font-size:clamp(9px,1.3vw,11px);letter-spacing:.1em}.controls{display:flex;justify-content:center;align-items:center;gap:14px;padding:0 12px 15px}.btn{border:1px solid #a7b1aa;background:#ffffffc9;color:var(--ink);border-radius:30px;padding:11px 18px;font-weight:700;cursor:pointer}.btn:hover{background:#fff}.btn:disabled{opacity:.35;cursor:not-allowed}.counter{font-size:12px;color:#32463e;min-width:82px;text-align:center}.hint{text-align:center;font-size:11px;color:#40574d;padding:0 16px 18px}.footer{text-align:center;background:#102a2a;color:#c9d4cd;padding:12px;font-size:10px;letter-spacing:.08em}
@media(max-width:650px){.top{padding:13px 15px}.top small{display:none}.stage{padding:16px 10px 12px;min-height:auto}.book{width:min(88vw, calc((100dvh - 205px) * .6515));max-height:calc(100dvh - 205px)}.content{padding:7%}.cover .h1{font-size:clamp(34px,9vw,48px)}.property-img{height:36%;min-height:90px}.controls{gap:7px;padding-bottom:12px}.btn{padding:10px 12px;font-size:12px}.counter{min-width:66px;font-size:11px}.hint{padding-bottom:14px}}
@media(max-height:600px) and (min-width:651px){.book{width:min(31vw, calc((100vh - 170px) * .6515));max-height:calc(100vh - 150px)}.stage{min-height:auto;padding:12px}}
</style></head><body>
<header class="top"><div class="brand">BOOKLET <span>PROPERTY</span></div><small>KATALOG PROPERTI · F4 PORTRAIT</small></header>
<main class="stage"><div class="book" id="book" aria-label="Katalog properti interaktif, satu halaman portrait F4">
<section class="page" id="currentPage" aria-live="polite"></section>
</div></main>
<div class="controls"><button class="btn" id="prev" aria-label="Halaman sebelumnya">← Sebelumnya</button><span class="counter" id="counter">Sampul · 1/6</span><button class="btn" id="next" aria-label="Halaman berikutnya">Berikutnya →</button></div><div class="hint">Satu lembar portrait F4 · Klik tombol, gunakan panah keyboard, atau usap layar untuk membalik halaman.</div>
<footer class="footer">BOOKLET PROPERTY · KATALOG DIGITAL INTERAKTIF</footer>
<script>
const pages=[
{type:'cover',eyebrow:'Property collection · 2026',title:'BOOKLET<br>PROPERTY',subtitle:'Ruang baru. Bab baru.',desc:'Katalog properti pilihan untuk menemukan tempat yang tepat bagi masa depan Anda.'},
{eyebrow:'Selamat datang',title:'Temukan ruang untuk cerita berikutnya.',desc:'Koleksi properti pilihan untuk tempat tinggal, investasi, dan peluang baru. Setiap halaman dirancang untuk membantu Anda melihat potensi sebuah properti dengan lebih jelas.',tag:'Pilihan properti'},
{eyebrow:'01 · Rumah dijual',title:'Hunian hangat untuk keluarga.',desc:'Rumah dengan tata ruang nyaman, akses yang praktis, dan lingkungan yang mendukung keseharian.',price:'Harga: hubungi kami',facts:[['—','Kamar tidur'],['—','Kamar mandi'],['— m²','Luas tanah']]},
{eyebrow:'02 · Tanah & investasi',title:'Peluang untuk masa depan.',desc:'Pilihan lahan dan aset properti untuk dipertimbangkan. Detail lokasi, luas, akses, dan legalitas perlu diverifikasi sebelum transaksi.',price:'Harga sesuai listing',facts:[['— m²','Luas tanah'],['—','Legalitas'],['—','Akses jalan']]},
{eyebrow:'Layanan kami',title:'Dari pencarian sampai keputusan.',desc:'Kami membantu Anda meninjau pilihan, menjadwalkan survei, dan mengumpulkan informasi properti sebelum mengambil keputusan.',tag:'Konsultasi properti'},
{eyebrow:'Hubungi kami',title:'Properti yang tepat dimulai dari percakapan.',desc:'Tanyakan ketersediaan, detail lokasi, harga, dan jadwal survei. Ganti informasi contoh ini dengan kontak resmi bisnis Anda.',tag:'Kontak & pemesanan',cta:true}
];let current=0,animating=false;const book=document.getElementById('book'),currentPage=document.getElementById('currentPage'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next');
function makeContent(p,n){let c=document.createElement('div');c.className='content '+(p.type==='cover'?'cover':'');c.innerHTML=`<div class="eyebrow">${p.eyebrow||''}</div>${p.type==='cover'?`<div class="h1">${p.title}</div><div class="h2" style="color:#f4e8cd">${p.subtitle}</div><p class="body">${p.desc||''}</p><div class="cover-art"></div>`:`<div class="h2">${p.title||''}</div><p class="body">${p.desc||''}</p>${p.price?`<div class="price">${p.price}</div>`:''}${p.facts?`<div class="facts">${p.facts.map(f=>`<div class="fact"><b>${f[0]}</b><span>${f[1]}</span></div>`).join('')}</div>`:''}${p.type!=='cover'?'<div class="property-img"></div>':''}${p.tag?`<div class="tag">${p.tag}</div>`:''}${p.cta?'<a class="cta" href="https://wa.me/" target="_blank" rel="noreferrer">HUBUNGI VIA WHATSAPP ↗</a>':''}`}<div class="folio"><span>BOOKLET PROPERTY</span><span>${String(n).padStart(2,'0')}</span></div>`;return c}
function paint(){currentPage.innerHTML='';currentPage.append(makeContent(pages[current],current+1));counter.textContent=(current===0?'Sampul':`Halaman ${current+1}`)+` · ${current+1}/${pages.length}`;prev.disabled=current===0;next.disabled=current===pages.length-1}
function go(dir){if(animating)return;let target=current+dir;if(target<0||target>=pages.length)return;animating=true;const sheet=document.createElement('div');sheet.className='sheet';sheet.style.zIndex='10';const front=document.createElement('div');front.className='face front';front.append(makeContent(pages[current],current+1));const back=document.createElement('div');back.className='face back';back.append(makeContent(pages[target],target+1));sheet.append(front,back);book.append(sheet);current=target;paint();requestAnimationFrame(()=>{if(dir>0)sheet.classList.add('flipped');else{sheet.style.transform='rotateY(-180deg)';requestAnimationFrame(()=>sheet.style.transform='rotateY(0deg)')}});setTimeout(()=>{sheet.remove();animating=false},850)}
prev.addEventListener('click',()=>go(-1));next.addEventListener('click',()=>go(1));document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});let sx=0;book.addEventListener('touchstart',e=>{sx=e.changedTouches[0].screenX},{passive:true});book.addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-sx;if(Math.abs(dx)>40)go(dx<0?1:-1)},{passive:true});paint();
</script></body></html>
